# ============================================
# Bike Rebalancing ML - Colab Configuration
# ============================================
# Linux paths + bigger samples for Google Colab (~12-50 GB RAM).

# --- Paths ---
raw_data_path: "/content/prj"              # Folder containing the year ZIP files
processed_data_path: "/content/prj/data/processed"
features_data_path: "/content/prj/data/features"
models_path: "/content/prj/models"
outputs_path: "/content/prj/outputs"
temp_extract_path: "/content/tmp_extract"

# --- Time ---
time_interval_minutes: 10
model_interval_minutes: 60

# --- Weather (Open-Meteo Archive API, free, no key) ---
use_weather: true
weather_data_path: "/content/prj/data/processed/weather_hourly.parquet"
weather_lat: 40.7128
weather_lng: -74.0060
weather_start_date: "2022-01-01"
weather_end_date: "2023-12-31"
weather_timezone: "America/New_York"

# --- Splitting ---
train_ratio: 0.70
validation_ratio: 0.15
test_ratio: 0.15

# --- Station ---
min_trips_per_month: 5

# --- Model ---
random_seed: 42
n_iter_search: 10
n_iter_search_rf: 3
train_random_forest: true
max_train_rows: 5000000          # Lower to 3000000 on a standard (non High-RAM) runtime
max_val_rows: 1500000
rf_max_rows: 1000000

# --- Surplus / deficit evaluation & rebalancing ---
imbalance_threshold: 3
vehicle_capacity: 20
num_vehicles: 15
max_route_distance_km: 3.0
min_move_bikes: 3
rebalance_windows:
  - ["07:00", "10:00"]
  - ["16:00", "19:00"]

# --- Processing ---
chunk_size: 200000
months_filter: null              # null = use all 24 months
